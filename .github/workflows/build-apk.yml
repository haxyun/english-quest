name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: EnglishQuest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler l'APK
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EnglishQuest.apk

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: EnglishQuest-apk
          path: EnglishQuest/EnglishQuest.apk
          retention-days: 30

      - name: Publier une Release (téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: English Quest build ${{ github.run_number }}
          body: APK compilé automatiquement.
          files: EnglishQuest/EnglishQuest.apk
          make_latest: true
